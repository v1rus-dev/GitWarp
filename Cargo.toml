[workspace]
resolver = "2"
members = [
    "crates/git-graph",
    "crates/git-core",
    "crates/forge",
    "crates/app",
    "crates/ui",
]
# `cargo test` / `cargo build` without -p skip the GPUI app:
# the core crates stay fast to build and test.
default-members = [
    "crates/git-graph",
    "crates/git-core",
    "crates/forge",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
git-graph = { path = "crates/git-graph" }
git-core = { path = "crates/git-core" }
forge = { path = "crates/forge" }
ui = { path = "crates/ui" }

# In-process git. `gix` 0.90 needs Rust 1.88 (the workspace MSRV is 1.89 for
# `uuid` 1.29 and `aes` 0.9 in the lock). Default features stay off: discovery and the reads
# migrated so far only need hashing and a `Send` repository handle.
# `sentry` 0.49 (crates/app) needs Rust 1.89, the current workspace MSRV.
gix = { version = "0.90", default-features = false, features = ["parallel", "sha1"] }

# UI: Zed's GPUI. Pinned on purpose: this is a snapshot of Zed's GPUI
# (zed@08cbb88) with the wgpu renderer, and its API still moves between
# releases.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep dev builds of the heavy UI deps optimized: GPUI is very slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
