[package]
name = "app"
description = "The desktop client (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gitwarp"
path = "src/main.rs"

[dependencies]
git-core.workspace = true
git-graph.workspace = true
forge.workspace = true
ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
# Crash reports, sent only while Settings → Privacy → telemetry is on.
# ureq + rustls instead of the default reqwest + native-tls: no tokio runtime
# and no system OpenSSL.
sentry = { version = "0.49.5", default-features = false, features = [
    "backtrace", "contexts", "debug-images", "panic", "ureq", "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.26.13"
tree-sitter-highlight = "=0.26.13"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-md = { version = "0.5.4", default-features = false }
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
