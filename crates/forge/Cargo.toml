[package]
name = "forge"
description = "Hosting-service model and remote URL resolution (GitHub, GitLab, ...), UI-agnostic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
keyring-core = "1.0.1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
