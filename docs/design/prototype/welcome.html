<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitWarp — welcome</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="gitwarp.css">
<link rel="stylesheet" href="activity.css">
<style>
  .wl { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
  .wl aside { padding: 28px 24px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
  .logo { display: flex; align-items: center; gap: 10px; font-size: var(--fs-xl); font-weight: 700; margin-bottom: 4px; }
  .act { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg); cursor: default; width: 100%; text-align: left; }
  .wl aside > .od-fill { flex: 1 1 0; }
  .act:hover { background: var(--hover); } .act .kbd { margin-left: auto; }
  .wl main { padding: 20px 24px; display: flex; flex-direction: column; min-height: 0; gap: 12px; }
  .recent { overflow: auto; flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); outline: none; }
  .rrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) 150px 110px; gap: 12px; align-items: center; height: 44px; padding: 0 12px; cursor: default; border-bottom: 1px solid var(--border); }
  .rrow:last-child { border-bottom: 0; }
  .rrow:hover { background: var(--hover); } .rrow.sel { background: var(--selection); }
  .rrow .n { font-weight: 600; } .rrow .p { color: var(--muted); font-size: var(--fs-sm); }
  /* "Your activity" card (welcome_activity.rs): title FS_LG bold, total, scope segmented; panel p12 gap8 r7; compact 8px heatmap */
  .wact-head { display: flex; align-items: center; gap: 8px; width: 100%; }
  .wact-head h2 { margin: 0; font-size: var(--fs-lg); font-weight: 700; }
  .wact-sec { flex: none; display: flex; flex-direction: column; gap: 12px; }
  .wact-sec[hidden] { display: none; }
  .wact .heat { --heat-base: 8px; }
  .wact .heat-legend { --heat-cell: 8px; }
  .wact .heat-msg { min-height: 84px; gap: 8px; flex-wrap: wrap; }
  .wact .heat-msg > span { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .wact-foot .heat-total { display: inline-flex; align-items: center; gap: 4px; }
  .wact-foot .heat-total .mono { color: var(--text); }
  .wact .heat-wd { color: var(--muted); }
  .kbd.arr { min-width: 22px; }
  .tip { white-space: pre-line; }
</style>
<link rel="stylesheet" href="dialogs.css">
<script src="app.js"></script>
<script src="dialogs.js"></script>
</head>
<body>
<script>
(function () {
  const G = GL, ic = G.ic, esc = G.esc, D = GLD;
  const SC = [['', 'Initialize dialog: closed'], ['empty', 'Initialize · empty'], ['plain', 'Initialize · plain folder'], ['missing', 'Initialize · folder will be created'], ['nobranch', 'Initialize · no branch name'], ['repo', 'Initialize · already a repository'], ['nested', 'Initialize · inside a repository'], ['probing', 'Initialize · checking the folder'], ['gitmissing', 'Initialize · git unavailable'], ['readfail', 'Initialize · could not read the folder'], ['running', 'Initialize · running git init'], ['failed', 'Initialize · init failed'], ['picker', 'Initialize · folder picker failure']];

  const sel = (id, label, opts) => `<label style="display:inline-flex;gap:8px;align-items:center;font-size:12px">${label}<select id="${id}" aria-label="${label}" style="height:24px;background:var(--bg);color:var(--text);border:1px solid var(--border-strong);border-radius:var(--r-sm)">${opts.map((o, k) => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></label>`;

  const win = G.h(`<div class="win" style="width:960px;height:620px;grid-template-rows:var(--bar) minmax(0,1fr) var(--status)">

      <div class="od-row"><h2 style="margin:0;font-size:var(--fs-lg)" class="od-fill">Recent repositories</h2><label class="input-wrap" style="width:240px">${ic('search', 14)}<input class="input" id="flt" placeholder="Filter recent…" aria-label="Filter recent repositories"></label></div>
      <div class="recent" id="recent" role="listbox" tabindex="0" aria-label="Recent repositories"></div>
      <div class="muted" style="font-size:12px"><span class="kbd arr"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-label="Up" style="vertical-align:-1px"><path d="M6 10.2V1.8M2.6 5.2L6 1.8l3.4 3.4"/></svg></span> <span class="kbd arr"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-label="Down" style="vertical-align:-1px"><path d="M6 1.8v8.4M2.6 6.8L6 10.2l3.4-3.4"/></svg></span> select · <span class="kbd">Enter</span> open · <span class="kbd">Del</span> remove from list</div></main></div>
    <footer class="statusbar"><span class="sb-btn" id="appver" data-tip="GitWarp version">GitWarp v0.2.1</span><span class="od-fill"></span><span class="sb-btn" id="gitlabel"></span></footer></div>`);
  stage.firstChild.appendChild(win);
  G.initTips(win);
  const list = win.querySelector('#recent'); let sel_ = 0, rec = R.slice();
  const rows = () => G.$$('.rrow', list);
  const draw = () => {
    const f = win.querySelector('#flt').value.trim().toLowerCase(), v = rec.filter((r) => !f || (r[0] + ' ' + r[1]).toLowerCase().includes(f));
    list.innerHTML = !rec.length ? `<div class="empty" style="height:100%;align-content:center">${ic('folder', 24)}<b>No recent repositories</b><span>Open or clone a repository to see it here.</span></div>`
      : !v.length ? `<div class="empty" style="height:100%;align-content:center">${ic('folder', 24)}<b>No matches</b><span>No recent repository matches “${esc(win.querySelector('#flt').value.trim())}”.</span></div>`
      : v.map((r, i) => `<div class="rrow${i === 0 ? ' sel' : ''}" role="option" aria-selected="${i === 0}" data-n="${esc(r[0])}"><span>${ic('folder', 16)}</span><div style="min-width:0"><div class="n">${esc(r[0])}</div><div class="p od-truncate mono">${esc(r[1])}</div></div><span class="od-truncate muted" style="font-size:12px">${r[2] === '—' ? '—' : ic('branch', 12) + ' ' + esc(r[2])}</span><span class="muted" style="font-size:12px;text-align:right">${r[3]}</span></div>`).join('');
    sel_ = 0; if (window.__wact) window.__wact();
  };
  const pick = (i) => { sel_ = Math.max(0, Math.min(rows().length - 1, i)); rows().forEach((r, k) => { r.classList.toggle('sel', k === sel_); r.setAttribute('aria-selected', k === sel_); }); if (window.__wact) window.__wact(); };
  win.querySelector('#flt').addEventListener('input', draw);
  document.getElementById('lst').addEventListener('change', (e) => { rec = e.target.value === 'none' ? [] : R.slice(); draw(); });
  list.addEventListener('click', (e) => { const r = e.target.closest('.rrow'); if (r) pick(rows().indexOf(r)); });
  list.addEventListener('dblclick', (e) => { if (e.target.closest('.rrow')) location.href = 'main-1200.html'; });
  list.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { pick(sel_ + 1); e.preventDefault(); } else if (e.key === 'ArrowUp') { pick(sel_ - 1); e.preventDefault(); } else if (e.key === 'Enter' && rows().length) location.href = 'main-1200.html'; else if (e.key === 'Delete' && rows().length) { rec.splice(sel_, 1); draw(); } });
  /* status-bar git label: text + tooltip (the tooltip carries the path, or the failure title when git is unusable) */
  const gl = () => { const g = document.getElementById('git').value, l = win.querySelector('#gitlabel'); const t = { system: ['git 2.56.0 · system', 'git 2.56.0 · system · /usr/bin/git'], ok: ['git 2.56.0 · bundled', 'git 2.56.0 · bundled · /opt/gitwarp/git/bin/git'], old: ['git 2.19.1 too old', 'Git is too old: 2.19.1 found, 2.30 or newer is required'], none: ['git not found', 'Git was not found on this machine'] }[g]; l.innerHTML = ic('git', 12) + t[0]; l.dataset.tip = t[1]; };
  document.getElementById('git').addEventListener('change', gl);
  /* Init dialog scenes */
  const scn = () => {
    const k = document.getElementById('scn').value; D.closeAll(win); const tc = G.layer(win).querySelector('.toasts'); if (tc) tc.remove();
    if (!k) return;
    const P = { empty: {}, plain: { path: '~/develop/notes' }, missing: { path: '~/develop/new-project' }, nobranch: { path: '~/develop/notes', ibranch: '' }, repo: { path: '~/develop/open-design' }, nested: { path: '~/develop/gitwarp/src' }, probing: { path: '~/develop/notes', probing: true }, gitmissing: { path: '~/develop/notes', force: 'gitmissing' }, readfail: { path: '/mnt/data/notes', force: 'readfail' }, running: { path: '~/develop/notes', phase: 'running' }, failed: { path: '~/develop/notes', initErr: 'fatal: cannot mkdir ~/develop/notes/.git: Read-only file system' }, picker: {} }[k];
    D.initRepo(win, P);
    if (k === 'picker') D.toastStrip(win, [['error', 'Could not open the folder picker: no xdg-desktop-portal is running']]);
  };
  document.getElementById('scn').addEventListener('change', scn);
  win.querySelector('#clone').onclick = () => D.repo(win, { tab: 'clone' });
  win.querySelector('#init').onclick = () => D.initRepo(win, {});
  /* Settings lives on its own design page; the main window opens it as a modal, the welcome screen navigates to it */
  const openSettings = () => { location.href = 'settings-general.html'; };
  win.querySelector('#settings').onclick = openSettings;
  addEventListener('keydown', (e) => { if (e.ctrlKey && !e.shiftKey && e.key === ',') { e.preventDefault(); openSettings(); } });
  win.querySelector('#open').onclick = () => D.repo(win, { tab: 'open' });
  addEventListener('keydown', (e) => { if (!e.ctrlKey || e.shiftKey) return; if (e.key.toLowerCase() === 'n') { e.preventDefault(); D.initRepo(win, {}); } });

  /* ---- "Your activity" card (welcome_activity.rs). Heatmap drawn locally from the activity.css classes. ---- */
  const DAY = 86400000, TODAY = Date.UTC(2026, 10, 9), WEEKS = 53, ME = 'mira.okonkwo@example.dev', HOME_NOTES = '/mnt/data/notes';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const dow = (t) => (new Date(t).getUTCDay() + 6) % 7, key = (t) => new Date(t).toISOString().slice(0, 10), fmtN = (n) => n.toLocaleString('en-US');
  const dateLong = (t) => { const d = new Date(t); return `${WD[dow(t)]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
  const plural = (n, one, other) => (n === 1 ? one : other).replace('{n}', fmtN(n));
  const START = TODAY - dow(TODAY) * DAY - (WEEKS - 1) * 7 * DAY, FIRST = TODAY - 364 * DAY;
  const rng = (seed) => { let x = seed >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; };
  const series = (seed, scale) => { const r = rng(seed), out = {}; for (let t = FIRST; t <= TODAY; t += DAY) { const w = dow(t) >= 5 ? 0.25 : 1, p = r(); if (p < 0.5 * scale * w + 0.04) out[key(t)] = 1 + Math.floor(r() * r() * 7 * scale); } return out; };
  const REPO_SCALE = { 'gitwarp': 0.9, 'open-design': 0.6, 'zed-themes': 0.25, 'dotfiles': 0.18, 'tree-sitter-rust': 0.12 };
  const PER = {}; Object.keys(REPO_SCALE).forEach((n, i) => { PER[n] = series(7 + i * 31, REPO_SCALE[n]); });
  const sumData = (names) => { const o = {}; names.forEach((n) => Object.entries(PER[n] || {}).forEach(([k, v]) => { o[k] = (o[k] || 0) + v; })); return o; };
  function buckets(values) {
    const nz = values.filter((v) => v > 0).sort((a, b) => a - b); if (!nz.length) return () => 0;
    const max = nz[nz.length - 1];
    if (new Set(nz).size <= 4) return (v) => (v <= 0 ? 0 : Math.max(1, Math.ceil((4 * v) / max)));
    const q = (p) => nz[Math.min(nz.length - 1, Math.ceil(p * nz.length) - 1)], t = [q(0.25), q(0.5), q(0.75)];
    return (v) => (v <= 0 ? 0 : v <= t[0] ? 1 : v <= t[1] ? 2 : v <= t[2] ? 3 : 4);
  }
  function heat(data, o) {
    const vals = []; for (let t = FIRST; t <= TODAY; t += DAY) vals.push(data[key(t)] || 0);
    const lvl = buckets(o.zero ? [] : vals); let months = '', last = -9;
    for (let c = 0; c < WEEKS; c++) {
      for (let d = 0; d < 7; d++) { const t = START + (c * 7 + d) * DAY; if (new Date(t).getUTCDate() === 1 && t >= FIRST && t <= TODAY && c - last >= 3) { months += `<span style="left:calc(${c} * var(--pitch))">${MON[new Date(t).getUTCMonth()]}</span>`; last = c; } }
      if (c === 0 && last < 0 && new Date(Math.max(START, FIRST)).getUTCDate() <= 21) { months += `<span style="left:0">${MON[new Date(Math.max(START, FIRST)).getUTCMonth()]}</span>`; last = 0; }
    }
    let rows = '';
    for (let d = 0; d < 7; d++) {
      rows += `<div role="row" aria-label="${WD[d]}">`;
      for (let c = 0; c < WEEKS; c++) {
        const t = START + (c * 7 + d) * DAY;
        if (t > TODAY || t < FIRST) { rows += '<div class="hc future" role="gridcell" aria-hidden="true"></div>'; continue; }
        const v = o.zero ? 0 : data[key(t)] || 0, pend = o.pendingFrom != null && t < o.pendingFrom, l = lvl(v);
        const lab = o.loading || pend ? `Counting commits on ${dateLong(t)}` : v === 0 ? `No commits on ${dateLong(t)}` : plural(v, '1 commit on ', '{n} commits on ') + dateLong(t);
        rows += `<div class="hc${!pend && !o.loading && l ? ' l' + l : ''}${pend ? ' pending' : ''}" role="gridcell" tabindex="-1" data-t="${t}" data-v="${pend || o.loading ? 0 : v}" aria-label="${esc(lab)}"></div>`;
      }
      rows += '</div>';
    }
    return `<div class="heat compact${o.loading ? ' loading' : ''}" style="--cols:${WEEKS}"><div class="heat-months" aria-hidden="true" style="width:calc(${WEEKS} * var(--pitch))">${months}</div>
      <div class="heat-wd" aria-hidden="true">${WD.map((w, i) => `<span>${i % 2 === 0 && i < 6 ? w : ''}</span>`).join('')}</div>
      <div class="heat-grid" role="grid" tabindex="0" aria-label="${esc(o.label)}" aria-readonly="true">${rows}</div></div>`;
  }
  const legend = () => `<span class="heat-legend" aria-label="Colour scale: less to more commits"><span class="t" style="margin-left:0">Less</span>${[0, 1, 2, 3, 4].map((l) => `<span class="hc${l ? ' l' + l : ''}"></span>`).join('')}<span class="t" style="margin-right:0">More</span></span>`;
  const wact = win.querySelector('#wact'); let scope = 'all', wired = false, tipEl = null;
  const showTip = (c) => {
    if (tipEl) { tipEl.remove(); tipEl = null; } if (!c || c.classList.contains('future')) return;
    const layer = G.layer(win); tipEl = G.h(`<div class="tip" role="tooltip">${esc(c.getAttribute('aria-label'))}</div>`); layer.appendChild(tipEl);
    const sc = G.scale(win), wr = win.getBoundingClientRect(), cr = c.getBoundingClientRect(), x = (cr.left - wr.left + cr.width / 2) / sc, y = (cr.top - wr.top) / sc;
    tipEl.style.left = Math.max(4, Math.min(win.offsetWidth - tipEl.offsetWidth - 4, x - tipEl.offsetWidth / 2)) + 'px'; tipEl.style.top = (y - tipEl.offsetHeight - 6) + 'px';
  };
  const move = (g, c) => { if (!c) return; g.querySelectorAll('.hc.kf').forEach((x) => x.classList.remove('kf')); c.classList.add('kf'); showTip(c); };
  function pickDay(cell) {
    const v = +cell.dataset.v, t = +cell.dataset.t; if (!v) return;
    const reach = Object.keys(PER).filter((n) => !(PER[n] && !PER[n][key(t)])), names = Object.keys(PER).filter((n) => (PER[n][key(t)] || 0) > 0);
    if (scope === 'sel') { G.toast(win, `Opened ${cur().name}`, 'ok'); return; }
    const parts = names.length ? names.map((n) => [n, PER[n][key(t)]]) : [['gitwarp', v]];
    const cr = cell.getBoundingClientRect(), at = { clientX: cr.left, clientY: cr.bottom + 4 };
    G.menu(win, at, [{ label: `${dateLong(t)} — open with History filtered to this day`, disabled: true }].concat(parts.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([n, k]) => ({ label: `${n} · ${plural(k, '{n} commit', '{n} commits')}`, icon: 'folder', onClick: () => G.toast(win, `Opened ${n} · History filtered to ${dateLong(t)}`, 'ok') }))));
  }
  const cur = () => { const r = G.$$('.rrow', win.querySelector('#recent'))[sel_]; return r ? { name: r.dataset.n } : null; };
  function actDraw() {
    const mode = document.getElementById('act').value;
    if (mode === 'off') { wact.hidden = true; return; } wact.hidden = false;
    const paths = rec.map((r) => r[0]), skipped = mode === 'ok' || mode === 'unavail' ? rec.filter((r) => r[1] === HOME_NOTES) : [];
    const sc = cur(); if (!sc && scope === 'sel') scope = 'all';
    let selName = sc ? sc.name : null;
    if (mode === 'unavail' && sc && rec.some((r) => r[0] === sc.name)) { /* the selected row is the unreachable one */ }
    const unreachable = scope === 'sel' && selName && rec.find((r) => r[0] === selName && r[1] === HOME_NOTES) && mode !== 'clean';
    const reach = paths.filter((n) => PER[n]).length;
    const data = scope === 'all' ? sumData(paths) : PER[selName] || {};
    const counting = mode === 'counting', loading = mode === 'loading', zero = mode === 'none' || !Object.keys(data).length && !counting && !loading;
    const noEmail = mode === 'noemail';
    const pendingFrom = counting ? TODAY - 6 * 7 * DAY : null;
    let total = 0; for (let t = FIRST; t <= TODAY; t += DAY) if (!(pendingFrom != null && t < pendingFrom)) total += zero ? 0 : data[key(t)] || 0;
    let head = '';
    if (noEmail) head = '';
    else if (unreachable) head = '<span class="heat-total">Unavailable</span>';
    else if (loading) head = '<span class="skel" style="width:180px;height:14px;display:inline-block"></span>';
    else if (counting) head = `<span class="heat-total" style="display:inline-flex;gap:4px;align-items:center">${ic('fetch', 12, 'spin')}${plural(total, 'Counting… <b>{n}</b> commit so far', 'Counting… <b>{n}</b> commits so far')}</span>`;
    else if (total === 0) head = '<span class="heat-total">No commits by you in the last year</span>';
    else head = `<span class="heat-total">${plural(total, '<b>{n}</b> commit by you in the last year', '<b>{n}</b> commits by you in the last year')}</span>`;
    const selLab = selName || 'Selected';
    const seg = `<span class="seg sm" role="group" aria-label="Activity scope"><button data-scope="all" aria-pressed="${scope === 'all'}" data-tip="${esc(plural(reach, 'Your commits in the {n} reachable recent repository', 'Your commits in the {n} reachable recent repositories'))}">All recent</button><button data-scope="sel" aria-pressed="${scope === 'sel'}"${sc ? '' : ' disabled style="opacity:.45"'} data-tip="Follows the selected row">${esc(selLab)}</button></span>`;
    let body;
    if (noEmail) body = `<div class="heat-msg">${ic('user', 16)}<span>Set a global <span class="mono">user.email</span> to see your activity across repositories. <a class="btn btn-sm" href="settings-identity.html" style="text-decoration:none">Set identity…</a></span></div>`;
    else if (unreachable) body = `<div class="heat-msg">${ic('warn', 16)}<span><span class="mono">${esc(HOME_NOTES)}</span> is not reachable, so its activity can’t be counted.</span></div>`;
    else body = `<div class="heat-scroll">${heat(data, { zero, loading, pendingFrom, label: `Your commit activity, ${scope === 'all' ? 'all recent repositories' : selName}, last 12 months` })}</div>`;
    let left = '';
    if (!noEmail && !loading && !unreachable) {
      if (!counting && total === 0) left = `No commits by <span class="mono">${ME}</span>`;
      else {
        left = `By <span class="mono">${ME}</span>`;
        if (scope === 'all' && !counting) {
          if (!skipped.length) left += ' ' + plural(paths.length, '· {n} repository', '· {n} repositories');
          else left += ' ' + plural(paths.length, '· {counted} of {n} repository', '· {counted} of {n} repositories').replace('{counted}', paths.length - skipped.length) + ` <span data-tip="${esc(plural(skipped.length, '{n} repository skipped:', '{n} repositories skipped:') + '\n' + skipped.map((r) => r[1] + ' — the folder does not exist').join('\n'))}" style="display:inline-flex">${ic('warn', 12)}</span>`;
        }
      }
    }
    const showLegend = !unreachable;
    wact.innerHTML = `<div class="wact-head"><h2>Your activity</h2>${head}<span class="od-fill"></span>${seg}</div>
      <div class="wact">${body}<div class="wact-foot"><span class="heat-total">${left}</span><span class="od-fill"></span>${showLegend ? legend() : ''}</div></div>`;
    const w = wact.querySelector('.wact-foot [data-tip] .od-icon'); if (w) w.style.color = 'var(--warning)';
    G.initTips(win);
    if (!wired) {
      wired = true;
      wact.addEventListener('click', (e) => { const b = e.target.closest('[data-scope]'); if (b && !b.disabled) { scope = b.dataset.scope; actDraw(); return; } const c = e.target.closest('.heat-grid .hc[data-t]'); if (c) { c.closest('.heat-grid').focus({ preventScroll: true }); move(c.closest('.heat-grid'), c); pickDay(c); } });
      wact.addEventListener('mouseover', (e) => { const c = e.target.closest('.heat-grid .hc[data-t]'); if (c) showTip(c); });
      wact.addEventListener('mouseout', (e) => { if (e.target.closest('.hc')) showTip(null); });
      wact.addEventListener('focusout', () => showTip(null));
      wact.addEventListener('focusin', (e) => { const g = e.target.closest('.heat-grid'); if (!g || e.target.closest('.hc[data-t]')) return; move(g, g.querySelector('.hc.kf') || [...g.querySelectorAll('.hc[data-t]')].pop()); });
      wact.addEventListener('keydown', (e) => {
        const g = e.target.closest('.heat-grid'); if (!g) return; const c0 = g.querySelector('.hc.kf'); if (!c0) return;
        const d = { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 }[e.key];
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickDay(c0); return; }
        let nt = d ? +c0.dataset.t + d * DAY : e.key === 'Home' ? +g.querySelector('.hc[data-t]').dataset.t : e.key === 'End' ? +[...g.querySelectorAll('.hc[data-t]')].pop().dataset.t : null;
        if (nt != null) { e.preventDefault(); const n = g.querySelector(`.hc[data-t="${nt}"]`); if (n) move(g, n); }
      });
    }
  }
  window.__wact = actDraw;
  document.getElementById('act').addEventListener('change', (e) => { if (e.target.value === 'unavail') { const i = G.$$('.rrow', list).findIndex((r) => r.dataset.n === 'notes'); if (i >= 0) pick(i); scope = 'sel'; } else if (scope === 'sel' && e.target.value !== 'unavail') { /* keep */ } actDraw(); });
  /* Settings → Appearance → "Show activity statistics" (gl-set-show-activity, default on): off hides the card, as in the app */
  const settingOff = () => { try { return JSON.parse(localStorage.getItem('gl-set-show-activity') ?? 'true') === false; } catch (e) { return false; } };
  addEventListener('storage', (e) => { if (e.key === 'gl-set-show-activity') { const a = document.getElementById('act'); if (settingOff() && a.value !== 'off') a.value = 'off'; else if (!settingOff() && a.value === 'off') a.value = 'ok'; actDraw(); } });
  if (settingOff()) document.getElementById('act').value = 'off';
  draw(); gl();
  { const q = new URLSearchParams(location.search); if (q.get('t') && G.THEMES[q.get('t')]) G.setTheme(q.get('t')); if (q.has('s')) { document.getElementById('scn').value = q.get('s'); scn(); } if (q.get('l')) { document.getElementById('lst').value = q.get('l'); document.getElementById('lst').dispatchEvent(new Event('change')); } if (q.get('a')) { document.getElementById('act').value = q.get('a'); if (q.get('a') === 'unavail') { pick(G.$$('.rrow', list).findIndex((r) => r.dataset.n === 'notes')); scope = 'sel'; } actDraw(); } if (q.get('sc') === 'sel') { scope = 'sel'; actDraw(); } if (q.has('sel')) { pick(+q.get('sel')); } if (q.get('g')) { document.getElementById('git').value = q.get('g'); gl(); } if (q.get('f')) { win.querySelector('#flt').value = q.get('f'); draw(); } }
  G.fit(win);
})();
</script>
