<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitWarp — Dialogs: merge / rebase</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="gitwarp.css">
<link rel="stylesheet" href="dialogs.css">
<script src="app.js"></script>
<script src="dialogs.js"></script>
</head>
<body>
<script>
(function () {
  const D = GLD, G = GL;
  const E = 'error: Your local changes to the following files would be overwritten by merge:\n\tsrc/ui/sidebar.rs\nPlease commit your changes or stash them before you merge.\nAborting';
  const ER = 'error: could not apply 8d41f6e... Fix detect order\nhint: Resolve all conflicts manually, mark them as resolved';
  const FILES12 = ['src/history/graph.rs', 'src/ui/sidebar.rs', 'src/settings/git_exec.rs', 'src/ui/toolbar.rs', 'src/ui/tree.rs', 'src/history/layout.rs', 'src/history/row.rs', 'src/settings/git_detect.rs', 'src/ui/palette.rs', 'src/changes/status.rs', 'Cargo.lock', 'docs/graph.md'];
  /* Menus: open the app's real menu (G.MENUS) next to the row it belongs to, like a right-click. */
  const menuAt = (w, sel, dx, items) => {
    const el = w.querySelector(sel); const r = el ? el.getBoundingClientRect() : w.getBoundingClientRect();
    G.menu(w, { clientX: r.left + (dx == null ? 60 : dx), clientY: r.bottom - 4 }, items);
  };
  const sideMenu = (kind, name, cur) => (w) => { G.state.head = cur || 'main'; menuAt(w, `.node[data-kind="${kind}"][data-name="${name}"]`, 70, G.MENUS(w)[kind](name)); };
  const histMenu = (w) => {
    const back = { label: 'Back', icon: 'undo', key: '‹' };
    const row = Array.from(w.querySelectorAll('.lrow')).find((r) => /feat\/palette/.test(r.textContent));
    const r = (row || w).getBoundingClientRect();
    G.menu(w, { clientX: r.left + 330, clientY: r.top + 6 }, [back, { sep: 1 }].concat(G.MENUS(w).branch('feat/palette')));
  };
  D.page('Dialogs: merge / rebase', [
    /* 0 */ ['Merge · checking for conflicts', (w) => D.merge(w, { preview: 'checking' })],
    /* 1 */ ['Merge · clean', (w) => D.merge(w, { preview: 'clean' })],
    /* 2 */ ['Merge · fast-forward', (w) => D.merge(w, { preview: 'ff' })],
    /* 3 */ ['Merge · fast-forward, No fast-forward chosen', (w) => D.merge(w, { preview: 'ff', type: 'noff' })],
    /* 4 */ ['Merge · conflicts (3 files)', (w) => D.merge(w, { preview: 'conflicts' })],
    /* 5 */ ['Merge · conflicts (12 files, collapsed)', (w) => D.merge(w, { preview: 'conflicts', files: FILES12 })],
    /* 6 */ ['Merge · up to date', (w) => D.merge(w, { preview: 'uptodate' })],
    /* 7 */ ['Merge · Fast-forward only, diverged', (w) => D.merge(w, { preview: 'clean', type: 'ffonly' })],
    /* 8 */ ['Merge · conflict check failed', (w) => D.merge(w, { preview: 'failed', reason: 'merge-tree exited with status 128' })],
    /* 8b */ ['Merge · git too old for the check', (w) => D.merge(w, { preview: 'oldgit' })],
    /* 9 */ ['Merge · with local changes', (w) => D.merge(w, { preview: 'clean', dirty: 6 })],
    /* 10 */ ['Merge · squash', (w) => D.merge(w, { preview: 'clean', type: 'squash' })],
    /* 11 */ ['Merge · running', (w) => D.merge(w, { preview: 'clean', phase: 'running' })],
    /* 12 */ ['Merge · error', (w) => D.merge(w, { preview: 'clean', dirty: 6, phase: 'error', err: E })],
    /* 13 */ ['Rebase · clean (Planned)', (w) => D.rebase(w, {})],
    /* 14 */ ['Rebase · up to date (Planned)', (w) => D.rebase(w, { preview: 'uptodate' })],
    /* 15 */ ['Rebase · local changes, stash off (Planned)', (w) => D.rebase(w, { dirty: 6 })],
    /* 16 */ ['Rebase · local changes, stash on (Planned)', (w) => D.rebase(w, { dirty: 6, autostash: true })],
    /* 17 */ ['Rebase · commits already published (Planned)', (w) => D.rebase(w, { published: true })],
    /* 18 */ ['Rebase · running (Planned)', (w) => D.rebase(w, { phase: 'running' })],
    /* 19 */ ['Rebase · error (Planned)', (w) => D.rebase(w, { phase: 'error', err: ER })],
    /* 20 */ ['Menu · sidebar, local branch (behind origin)', sideMenu('branch', 'feat/palette')],
    /* 21 */ ['Menu · sidebar, local branch (HEAD: merge / rebase disabled)', sideMenu('branch', 'main')],
    /* 22 */ ['Menu · sidebar, remote branch', sideMenu('rbranch', 'origin/feat/idle-lanes')],
    /* 23 */ ['Menu · History row, Branch feat/palette ›', histMenu],
    /* 24 */ ['Toasts · merge results', (w) => D.toastStrip(w, [['ok', 'Merged feat/palette into main'], ['ok', 'Fast-forwarded main to feat/palette'], ['ok', 'Squashed feat/palette into the index — commit it from Changes'], ['info', 'main is already up to date with feat/palette'], ['info', 'Merge of feat/palette is waiting for a commit'], ['warn', 'Merge stopped: 3 files have conflicts'], ['warn', 'Merge stopped: 1 file has conflicts']])],
    /* 25 */ ['Toasts · rebase results (Planned)', (w) => D.toastStrip(w, [['ok', 'Rebased main onto feat/palette'], ['warn', 'Rebase stopped at commit 2 of 4: conflicts in 2 files'], ['ok', 'Fast-forwarded feat/palette to origin/feat/palette'], ['ok', 'Pushed feat/palette to origin']])]
  ]);
})();
</script>
</body>
</html>
