<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitwarp — Dialogs: clone / open</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="gitwarp.css">
<link rel="stylesheet" href="dialogs.css">
<script src="app.js"></script>
<script src="dialogs.js"></script>
</head>
<body>
<script>
(function () {
  const D = GLD;
  const U = 'https://github.com/nexu-io/open-design.git';
  D.page('Dialogs: clone / open', [
    ['Clone · empty', (w) => D.repo(w, {})],
    ['Clone · HTTPS ready', (w) => D.repo(w, { url: U, touched: { url: true } })],
    ['Clone · invalid address', (w) => D.repo(w, { url: 'github.com/nexu-io', touched: { url: true } })],
    ['Clone · SSH, key picker', (w) => D.repo(w, { url: 'git@github.com:nexu-io/open-design.git', touched: { url: true } })],
    ['Clone · SSH, no keys found', (w) => D.repo(w, { url: 'git@github.com:nexu-io/open-design.git', noKeys: true })],
    ['Clone · folder exists', (w) => D.repo(w, { url: 'https://github.com/mira-k/gitwarp.git', touched: { name: true } })],
    ['Clone · shallow, bad depth', (w) => D.repo(w, { url: U, shallow: true, depth: '0', touched: { depth: true } })],
    ['Clone · in progress', (w) => D.repo(w, { url: U, phase: 'cloning', pct: 30 })],
    ['Clone · SSH auth error', (w) => D.repo(w, { url: 'git@github.com:acme/private-repo.git', phase: 'error', err: 'auth' })],
    ['Clone · host unreachable', (w) => D.repo(w, { url: 'https://unreachable.example/a/b.git', phase: 'error', err: 'net' })],
    ['Clone · done', (w) => D.repo(w, { url: U, phase: 'done', pct: 100 })],
    ['Open · empty', (w) => D.repo(w, { tab: 'open' })],
    ['Open · repository found', (w) => D.repo(w, { tab: 'open', path: '~/develop/open-design' })],
    ['Open · not a repository', (w) => D.repo(w, { tab: 'open', path: '~/develop/notes' })],
    ['Open · inside a repository', (w) => D.repo(w, { tab: 'open', path: '~/develop/gitwarp/src' })],
    ['Open · folder missing', (w) => D.repo(w, { tab: 'open', path: '~/develop/nope', touched: { path: true } })]
  ]);
})();
</script>
</body>
</html>
