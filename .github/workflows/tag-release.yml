name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: tag-release

jobs:
  tag:
    name: Tag and start release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the main -> develop comparison; credentials must persist to push the tag.
          fetch-depth: 0

      - name: Read version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          # First `version = "..."` inside the [workspace.package] section.
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "cannot read [workspace.package] version from Cargo.toml" >&2; exit 1; }
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid version '$version' in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Every ordinary push to main without a version bump lands here.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "tag $tag already exists; nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "GitWarp $tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Tags pushed with GITHUB_TOKEN do not trigger `on: push: tags`, but workflow_dispatch is
      # allowed. With a tag ref, github.ref is refs/tags/vX.Y.Z, so the publish job
      # (startsWith(github.ref, 'refs/tags/v')) runs.
      - name: Start release
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION"

      # PRs created with GITHUB_TOKEN do not trigger CI; develop has no required checks and CI
      # runs on push after the merge.
      - name: Back-merge PR
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          ahead="$(git rev-list --count origin/develop..origin/main)"
          if [ "$ahead" -eq 0 ]; then
            echo "develop already contains main"
            exit 0
          fi
          open="$(gh pr list --base develop --head main --state open --json number --jq length)"
          if [ "$open" -ne 0 ]; then
            echo "a main -> develop PR is already open"
            exit 0
          fi
          gh pr create --base develop --head main \
            --title "Merge main into develop after v$VERSION" \
            --body "Brings the v$VERSION release commit from main back into develop."
