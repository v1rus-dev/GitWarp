name: Release

on:
  push:
    tags: ['v*']
  # Dry runs: build and upload workflow artifacts, publish nothing
  # (the publish job only runs for tags).
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/release.sh
      - about.toml
      - about.hbs

permissions:
  contents: read

concurrency: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - name: Read Cargo version and check the tag
        id: v
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # First `version = "..."` inside the [workspace.package] section.
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "cannot read [workspace.package] version from Cargo.toml" >&2; exit 1; }
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "tag $REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
          # Releases are cut from main only (tag-release.yml creates the tags on main).
          if [ "$REF_TYPE" = "tag" ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $REF_NAME points at a commit that is not on main" >&2
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) keeps the glibc floor low for the app and the bundled git.
          - { target: linux, os: ubuntu-22.04 }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      # Matches LSMinimumSystemVersion in packaging/macos/Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build scripts of dependencies run in this job; keep the token out of .git/config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Linux system libraries
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libssl-dev \
            build-essential libcurl4-openssl-dev libexpat1-dev zlib1g-dev file

      - name: Build app
        shell: bash
        env:
          GITWARP_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: cargo build --release -p app --locked

      - name: Third-party licences
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          packaging/licenses.sh "$TARGET" bundle

      - name: Bundle git
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: packaging/git/fetch-or-build.sh "$TARGET" bundle

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: packaging/package.sh "$TARGET" bundle dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitwarp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for packaging/release-notes.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # Official static minisign binary, pinned by version and SHA-256 (the hash was
      # computed from the 0.12 release asset; update both together).
      - name: Install minisign
        shell: bash
        env:
          MINISIGN_VERSION: "0.12"
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/minisign"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/minisign.tar.gz" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  $dir/minisign.tar.gz" | sha256sum --check --strict -
          tar -xzf "$dir/minisign.tar.gz" -C "$dir" minisign-linux/x86_64/minisign
          echo "$dir/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - name: Sign checksums
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::Repository secret MINISIGN_SECRET_KEY is not set. A release must not be published unsigned; see RELEASING.md, 'Update signing'."
            exit 1
          fi
          umask 077
          keyfile="$(mktemp "$RUNNER_TEMP/minisign-key.XXXXXX")"
          cleanup() { shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"; }
          trap cleanup EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # An empty password means an unencrypted key: nothing is read from stdin.
          if [ -n "${MINISIGN_PASSWORD:-}" ]; then
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$keyfile" \
              -m dist/SHA256SUMS.txt -x dist/SHA256SUMS.txt.minisig
          else
            minisign -S -s "$keyfile" -m dist/SHA256SUMS.txt -x dist/SHA256SUMS.txt.minisig </dev/null
          fi
          test -s dist/SHA256SUMS.txt.minisig

      # Fails before publishing when the secret key does not match the public key
      # compiled into the app (packaging/update-key.pub), e.g. while it is the placeholder.
      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail
          minisign -V -p packaging/update-key.pub \
            -m dist/SHA256SUMS.txt -x dist/SHA256SUMS.txt.minisig

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # gh puts the notes file first and appends the generated notes after it.
          args=(--verify-tag --notes-file packaging/release-notes.md --generate-notes --title "GitWarp $VERSION")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"

  homebrew:
    name: Bump Homebrew cask
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v') && needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitwarp-macos
          path: dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: v1rus-dev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Casks/gitwarp.rb
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="dist/gitwarp-${VERSION}-macos-aarch64.dmg"
          [ -f "$dmg" ] || { echo "missing $dmg" >&2; exit 1; }
          sha="$(sha256sum "$dmg" | cut -d' ' -f1)"
          cask="tap/Casks/gitwarp.rb"
          sed -i -E \
            -e "s/^  version \"[^\"]*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \"[^\"]*\"/  sha256 \"${sha}\"/" \
            "$cask"
          grep -q "version \"${VERSION}\"" "$cask"
          grep -q "sha256 \"${sha}\"" "$cask"

      - name: Commit and push
        shell: bash
        working-directory: tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gitwarp.rb
          if git diff --cached --quiet; then
            echo "cask already at ${VERSION}"
            exit 0
          fi
          git commit -m "gitwarp ${VERSION}"
          git push
