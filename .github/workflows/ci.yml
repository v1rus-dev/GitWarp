name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Full debug info of the test binaries fills the ubuntu runner's disk (ld: Bus error).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libssl-dev

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test core crates
        run: cargo test
      # `ui` and `app` are not default members, so plain `cargo test` skips them.
      - name: Test ui and app
        run: cargo test -p ui -p app
      - name: Build ui examples
        run: cargo build -p ui --examples
      - name: Build app
        run: cargo build --release -p app
